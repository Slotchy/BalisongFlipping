<title>Balisong Flipping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#05070D;--fg:#F1F5FF;--muted:#8E9BB8;
  --glass:rgba(255,255,255,.045);--edge:rgba(255,255,255,.1);
  --ease:cubic-bezier(.22,.7,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Sora","Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100svh;display:flex;justify-content:center;align-items:center;
  padding:max(28px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}
.aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;width:75vmax;height:75vmax;border-radius:50%;will-change:transform;
  background:radial-gradient(closest-side,var(--b),transparent);animation:drift 26s ease-in-out infinite alternate}
.blob:nth-child(1){--b:rgba(47,91,255,.34);left:-25vmax;top:-30vmax}
.blob:nth-child(2){--b:rgba(123,77,255,.24);right:-30vmax;top:10vmax;animation-duration:32s;animation-delay:-8s}
.blob:nth-child(3){--b:rgba(24,200,255,.18);left:5vmax;bottom:-45vmax;animation-duration:38s;animation-delay:-16s}
@keyframes drift{to{transform:translate3d(9vmax,6vmax,0) scale(1.12)}}
#dots{position:fixed;left:0;top:0;width:100%;height:100%;height:100lvh;pointer-events:none;z-index:1}

main{position:relative;z-index:2;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
.logo{
  width:clamp(88px,26vw,116px);height:auto;margin:0 0 22px;cursor:pointer;
  filter:drop-shadow(0 0 26px rgba(90,130,255,.35));
  -webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;
  animation:spin 1.4s var(--ease) backwards;
}
.logo.flip{animation:flip .9s var(--spring)}
.eyebrow{margin:0 0 10px;font-size:.72rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);animation:rise .8s var(--ease) .4s backwards}
h1{
  margin:0 0 14px;text-align:center;font-weight:600;font-size:clamp(2.1rem,9.2vw,3.5rem);line-height:1.06;letter-spacing:-.04em;text-wrap:balance;
  color:var(--fg);animation:rise .9s var(--ease) .5s backwards;
}
@supports (background-clip:text) or (-webkit-background-clip:text){
  h1{background:linear-gradient(100deg,#fff 25%,#BCD0FF 60%,#D8C2FF 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
}
.tag{margin:0 0 clamp(28px,5vh,40px);text-align:center;color:var(--muted);font-size:clamp(.95rem,3.4vw,1.05rem);animation:rise .9s var(--ease) .62s backwards}

.cards{width:100%;display:grid;gap:12px}
.card{
  --c:#7B88FF;position:relative;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 16px 12px 12px;
  border-radius:20px;text-decoration:none;color:var(--fg);
  background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .35s var(--spring),border-color .25s,background-color .25s,box-shadow .3s;
  animation:rise .9s var(--spring) calc(.75s + var(--i)*.08s) backwards;
}
.ico{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.txt b{font-size:1rem;font-weight:600;letter-spacing:-.01em}
.txt small{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{flex:none;width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--spring),stroke .25s}
@media (hover:hover){
  .card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 55%,transparent);background:rgba(255,255,255,.07);box-shadow:0 14px 34px -14px var(--c)}
  .card:hover .go{transform:translateX(3px);stroke:var(--c)}
}
.card:active{transform:scale(.975)}
.card:focus-visible{outline:2px solid var(--c);outline-offset:3px}

.hint{margin:26px 0 0;font-size:.78rem;letter-spacing:.03em;color:var(--muted);opacity:.65;transition:opacity .4s;animation:fade 1s ease 1.9s backwards}
.hint.gone{opacity:0}

@keyframes spin{from{transform:rotate(-360deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes flip{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (max-height:640px){.logo{width:72px;margin-bottom:14px}.tag{margin-bottom:20px}.card{min-height:60px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
  var l=document.querySelector('.logo'),t=document.getElementById('hint');
  function flip(){l.classList.remove('flip');void l.offsetWidth;l.classList.add('flip');t.classList.add('gone')}
  l.setAttribute('role','button');l.setAttribute('tabindex','0');l.setAttribute('aria-label','Flip the logo');
  l.addEventListener('click',flip);
  l.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});

  var c=document.getElementById('dots'),x=c.getContext('2d');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,dpr=1,S=[],last=0,raf=0,timer=0,T=Math.PI*2,px=-1e4,py=-1e4,R=120;
  var COL=[[110,150,255],[90,210,255],[170,130,255],[255,130,190],[120,240,200]];
  function rnd(a,b){return a+Math.random()*(b-a)}
  function lite(c){return[(c[0]+255)>>1,(c[1]+255)>>1,(c[2]+255)>>1]}
  function sprite(b){
    var d=Math.ceil((b.s+4)*dpr),k=document.createElement('canvas');k.width=k.height=d;
    var g=k.getContext('2d');g.beginPath();g.arc(d/2,d/2,b.s/2*dpr,0,T);
    g.fillStyle='rgba('+b.c+','+b.fa+')';g.fill();
    g.lineWidth=dpr;g.strokeStyle='rgba('+lite(b.c)+','+b.sa+')';g.stroke();
    b.img=k;b.d=d/dpr;
  }
  function make(){
    var a=rnd(0,T),sp=rnd(3,12),b={x:rnd(0,W),y:rnd(0,H),s:rnd(9,32),sp:sp,c:COL[Math.floor(Math.random()*COL.length)],
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,fa:rnd(.02,.05),sa:rnd(.07,.15)};
    sprite(b);return b;
  }
  function size(){
    var nw=c.clientWidth,nh=c.clientHeight;
    if(!nw||!nh||(nw===W&&nh===H))return;
    var ow=W,oh=H;W=nw;H=nh;dpr=Math.min(devicePixelRatio||1,1.5);
    c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);x.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.min(110,Math.max(45,W*H/11000));
    if((navigator.hardwareConcurrency||8)<=4)n*=.7;
    n=Math.round(n);while(S.length<n)S.push(make());S.length=n;
    for(var i=0;i<n;i++){var b=S[i];if(ow&&oh){b.x*=W/ow;b.y*=H/oh}sprite(b)}
  }
  function hit(a,b){
    var dx=b.x-a.x,dy=b.y-a.y,m=(a.s+b.s)/2+1,q=dx*dx+dy*dy;
    if(q>=m*m||q===0)return;
    var d=Math.sqrt(q),nx=dx/d,ny=dy/d,ma=a.s*a.s,mb=b.s*b.s,o=m-d;
    a.x-=nx*o*mb/(ma+mb);a.y-=ny*o*mb/(ma+mb);b.x+=nx*o*ma/(ma+mb);b.y+=ny*o*ma/(ma+mb);
    var r=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(r<=0)return;
    var j=2*r/(1/ma+1/mb);a.vx-=j/ma*nx;a.vy-=j/ma*ny;b.vx+=j/mb*nx;b.vy+=j/mb*ny;
  }
  function draw(dt){
    var i,j,p,n=S.length,b;x.clearRect(0,0,W,H);
    for(i=0;i<n;i++){
      b=S[i];var dx=b.x-px,dy=b.y-py,q=dx*dx+dy*dy;
      if(q<R*R&&q>1){var d=Math.sqrt(q),f=(1-d/R)*320*dt;b.vx+=dx/d*f;b.vy+=dy/d*f}
      var v=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      if(v>b.sp){var nv=v+(b.sp-v)*(1-Math.exp(-1.4*dt));b.vx*=nv/v;b.vy*=nv/v}
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.x<-b.s)b.x=W+b.s;else if(b.x>W+b.s)b.x=-b.s;
      if(b.y<-b.s)b.y=H+b.s;else if(b.y>H+b.s)b.y=-b.s;
    }
    for(p=0;p<3;p++)for(i=0;i<n;i++)for(j=i+1;j<n;j++)hit(S[i],S[j]);
    for(i=0;i<n;i++){b=S[i];x.drawImage(b.img,b.x-b.d/2,b.y-b.d/2,b.d,b.d)}
  }
  function loop(ts){var dt=last?Math.min((ts-last)/1000,.05):0;last=ts;draw(dt);raf=requestAnimationFrame(loop)}
  function start(){if(!raf&&!reduce){last=0;raf=requestAnimationFrame(loop)}}
  function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
  function away(){px=py=-1e4}
  size();
  addEventListener('resize',function(){clearTimeout(timer);timer=setTimeout(function(){size();if(reduce)draw(0)},150)});
  addEventListener('pointermove',function(e){px=e.clientX;py=e.clientY},{passive:true});
  addEventListener('pointercancel',away);
  addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')away()});
  document.documentElement.addEventListener('pointerleave',away);
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start()});
  if(reduce)draw(0);else start();
})();
</script>
</body>
</html>
