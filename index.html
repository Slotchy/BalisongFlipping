<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balisong Flipping</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0C0E12;--fg:#F2F4F7;--muted:#9AA3B0;--card:#14181F;--line:#252B35;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%;margin:0}
body{min-height:100vh;min-height:100dvh}
body{background:radial-gradient(ellipse 70% 55% at 50% 45%,#141922 0%,var(--bg) 70%);color:var(--fg);font-family:"Sora","Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;position:relative;-webkit-font-smoothing:antialiased}
.logo{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));left:24px;width:clamp(38px,9vw,48px);height:auto}
.links a{-webkit-tap-highlight-color:transparent}
h1{margin:0;padding:0 24px;font-weight:600;font-size:clamp(2rem,5.6vw,4rem);line-height:1.12;letter-spacing:-.035em;text-align:center;text-wrap:balance}
main{display:flex;flex-direction:column;align-items:center;gap:clamp(32px,6vh,52px);width:100%}
.links{display:flex;gap:clamp(10px,3vw,22px);justify-content:center;flex-wrap:nowrap;padding:0 16px;width:100%}
.links a{display:grid;place-items:center;width:clamp(52px,14vw,64px);height:clamp(52px,14vw,64px);flex:0 0 auto;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--muted);transition:border-color .2s,color .2s,background .2s}
.links a:hover{border-color:#3A4557;color:var(--fg);background:#191E27}
.links a:focus-visible{outline:2px solid #6C86FF;outline-offset:3px}
.links svg{width:44%;height:44%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.links a{transition:none}}
@media (max-width:600px){main{padding-top:56px}}
#bubbles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main,.logo{z-index:1}
main{position:relative}
</style>
</head>

<script>
(function(){
  var c=document.getElementById('bubbles'),x=c.getContext('2d');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W,H,dpr,bubbles=[];
  function make(initial){
    var r=Math.random()*5+1.5;
    return {x:Math.random()*W,y:initial?Math.random()*H:H+r+Math.random()*60,r:r,
      v:0.18+Math.random()*0.42+r*0.03,a:0.05+Math.random()*0.13,
      ph:Math.random()*6.28,sw:0.15+Math.random()*0.35,sp:0.004+Math.random()*0.01};
  }
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(Math.min(70,Math.max(22,W*H/16000)));
    while(bubbles.length<n)bubbles.push(make(true));
    bubbles.length=n;
  }
  function draw(){
    x.clearRect(0,0,W,H);
    for(var i=0;i<bubbles.length;i++){
      var b=bubbles[i];
      b.y-=b.v;b.ph+=b.sp;
      var px=b.x+Math.sin(b.ph)*b.sw*12;
      var fade=Math.min(1,Math.max(0,b.y/(H*0.25)));
      var al=b.a*fade;
      if(b.y<-b.r*2){bubbles[i]=make(false);continue}
      x.beginPath();x.arc(px,b.y,b.r,0,6.283);
      x.fillStyle='rgba(150,175,255,'+(al*0.25)+')';x.fill();
      x.lineWidth=1;x.strokeStyle='rgba(200,215,255,'+al+')';x.stroke();
      x.beginPath();x.arc(px-b.r*0.35,b.y-b.r*0.35,b.r*0.22,0,6.283);
      x.fillStyle='rgba(255,255,255,'+(al*1.3)+')';x.fill();
    }
  }
  function loop(){draw();requestAnimationFrame(loop)}
  resize();window.addEventListener('resize',resize);
  if(reduce){draw()}else{loop()}
})();
